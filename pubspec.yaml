name: kems_companion
description: Premium KEMS companion app for Home Assistant.
publish_to: none
version: 1.4.0+17

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  fl_chart: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: '#050C10'
  adaptive_icon_foreground: assets/branding/kems_mark.png
  min_sdk_android: 23

flutter_native_splash:
  background_image: assets/branding/splash_background.png
  android_12:
    color: '#050C10'
    image: assets/branding/kems_mark.png
